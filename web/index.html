<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebRTC Screen Share</title>
</head>
<body>
  <button id="startBtn">Start Screen Share</button>
  <div id="status"></div>

  <script>

    // full disclosure - this code is 100% written by AI
    // I spent months trying to get this working and chatty P did it in 30s

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');

    let pc = null;
    let stream = null;
    let captureSettings = { width: 1920, height: 1080, frameRate: 60 };
    let fpsMonitor = null;
    let videoSender = null;
    let currentFps = "unknown";
    let currentWidth = "unknown";
    let currentHeight = "unknown";
    let isStreaming = false;
    let isStarting = false;

    function describeCaptureSettings(track) {
      const settings = track && typeof track.getSettings === 'function' ? track.getSettings() : {};
      const width = settings.width ?? 'unknown';
      const height = settings.height ?? 'unknown';
      const frameRate = settings.frameRate ?? 'unknown';
      return `${width}x${height} @ ${frameRate}fps`;
    }

    async function loadCaptureSettings() {
      try {
        const response = await fetch('/capture-settings');
        if (response.ok) {
          captureSettings = await response.json();
        }
      } catch (err) {
        console.error("Failed to load capture settings:", err);
      }
    }

    function updateStreamingStatus() {
      statusDiv.textContent = `✅ Streaming active (${currentWidth}x${currentHeight} @ ${currentFps}fps)`;
    }

    function stopFpsMonitor(resetStatus = true) {
      if (fpsMonitor) {
        clearInterval(fpsMonitor);
        fpsMonitor = null;
      }
      if (resetStatus) {
        currentFps = "unknown";
        currentWidth = "unknown";
        currentHeight = "unknown";
      }
      videoSender = null;
    }

    function startFpsMonitor(sender) {
      stopFpsMonitor(false);
      if (!sender || typeof sender.getStats !== 'function') {
        return;
      }

      let lastTimestamp = null;
      let lastFramesEncoded = null;

      fpsMonitor = setInterval(async () => {
        try {
          const stats = await sender.getStats();
          let videoStat = null;
          stats.forEach((report) => {
            if (!videoStat && report.type === 'outbound-rtp' && report.kind === 'video') {
              videoStat = report;
            }
          });

          if (!videoStat) {
            currentFps = "unknown";
            updateStreamingStatus();
            return;
          }

          const timestamp = videoStat.timestamp;
          const framesEncoded = typeof videoStat.framesEncoded === 'number'
            ? videoStat.framesEncoded
            : (typeof videoStat.framesSent === 'number' ? videoStat.framesSent : null);

          if (lastTimestamp !== null && lastFramesEncoded !== null && framesEncoded !== null) {
            const elapsedSeconds = (timestamp - lastTimestamp) / 1000;
            if (elapsedSeconds > 0) {
              const fps = (framesEncoded - lastFramesEncoded) / elapsedSeconds;
              currentFps = Number.isFinite(fps) ? fps.toFixed(1) : "unknown";
            }
          }

          if (framesEncoded !== null) {
            lastTimestamp = timestamp;
            lastFramesEncoded = framesEncoded;
          }

          updateStreamingStatus();
        } catch (err) {
          console.warn("Failed to read outbound video stats:", err);
          currentFps = "unknown";
          updateStreamingStatus();
        }
      }, 1000);
    }

    async function requestDisplayMedia() {
      const constraints = {
        video: {
          width: { ideal: captureSettings.width },
          height: { ideal: captureSettings.height },
          frameRate: { ideal: captureSettings.frameRate, max: captureSettings.frameRate },
        },
        audio: false,
      };

      if (navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function') {
        return navigator.mediaDevices.getDisplayMedia(constraints);
      }

      if (typeof navigator.getDisplayMedia === 'function') {
        return navigator.getDisplayMedia(constraints);
      }

      const origin = window.location.origin;
      const contextHint = window.isSecureContext
        ? ""
        : ` Screen capture requires HTTPS or localhost. Current origin: ${origin}`;

      throw new Error(`Screen capture API is unavailable in this browser.${contextHint}`);
    }

    async function checkAvailability() {
      try {
        const res = await fetch('/status');
        if (res.ok) {
          const data = await res.json();
          return data.available;
        }
      } catch (err) {
        console.error("Status check failed:", err);
      }
      return false;
    }

    async function stopStream(reason = "stopped") {
      stopFpsMonitor();
      isStreaming = false;
      isStarting = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if (pc) {
        pc.close();
        pc = null;
      }
      startBtn.textContent = "Start Screen Share";
      startBtn.disabled = false;
      statusDiv.textContent = `🛑 Stream ${reason}`;
      console.log("Stream stopped:", reason);
    }

    startBtn.onclick = async () => {
      if (isStreaming) {
        await stopStream("stopped by user");
        return;
      }

      if (isStarting) {
        return;
      }

      isStarting = true;
      startBtn.disabled = true;

      await loadCaptureSettings();

      const available = await checkAvailability();
      if (!available) {
        isStarting = false;
        startBtn.disabled = false;
        alert("Stream is currently busy. Try again later.");
        statusDiv.textContent = "❌ Stream busy";
        return;
      }

      try {
        stream = await requestDisplayMedia();
      } catch (err) {
        isStarting = false;
        startBtn.disabled = false;
        console.error("User cancelled or error:", err);
        if (!window.isSecureContext) {
          statusDiv.textContent = "❌ Screen share blocked: open this page via HTTPS or localhost";
        } else {
          statusDiv.textContent = "❌ Unable to start screen share";
        }
        return;
      }

      const videoTrack = stream.getVideoTracks()[0];
      try {
        await videoTrack.applyConstraints({
          width: { ideal: captureSettings.width },
          height: { ideal: captureSettings.height },
          frameRate: { ideal: captureSettings.frameRate, max: captureSettings.frameRate },
        });
      } catch (err) {
        console.warn("Unable to tighten video track constraints:", err);
      }

      pc = new RTCPeerConnection();

      // Handle disconnects (server-side closure or failure)
      pc.onconnectionstatechange = () => {
        console.log("Connection state:", pc.connectionState);
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          stopStream("disconnected");
        }
      };

      for (const track of stream.getTracks()) {
        const sender = pc.addTrack(track, stream);
        if (track.kind === 'video') {
          videoSender = sender;
        }
        if (track.kind === 'video' && sender && typeof sender.getParameters === 'function' && typeof sender.setParameters === 'function') {
          const parameters = sender.getParameters();
          parameters.encodings = parameters.encodings && parameters.encodings.length > 0
            ? parameters.encodings
            : [{}];
          parameters.encodings[0].maxFramerate = captureSettings.frameRate;
          sender.setParameters(parameters).catch((err) => {
            console.warn("Unable to apply sender framerate parameters:", err);
          });
        }
      }

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const response = await fetch("/offer", {
        method: "POST",
        body: JSON.stringify(pc.localDescription),
        headers: { "Content-Type": "application/json" },
      });

      if (!response.ok) {
        const message = await response.text();
        alert(message);
        stopStream("rejected");
        return;
      }

      const answer = await response.json();
      await pc.setRemoteDescription(answer);

      isStreaming = true;
      isStarting = false;
      startBtn.disabled = false;
      startBtn.textContent = "Stop Screen Share";
      currentFps = "starting...";

      // Optional: stop if the user manually stops sharing
      videoTrack.onended = () => {
        stopStream("ended by user");
      };

      const settings = videoTrack && typeof videoTrack.getSettings === 'function' ? videoTrack.getSettings() : {};
      currentWidth = settings.width ?? 'unknown';
      currentHeight = settings.height ?? 'unknown';
      currentFps = settings.frameRate ?? currentFps;

      const actualCapture = describeCaptureSettings(videoTrack);
      console.log("Capture settings:", actualCapture);
      updateStreamingStatus();

      startFpsMonitor(videoSender);
    };
  </script>
</body>
</html>
