<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebRTC Screen Share</title>
</head>
<body>
  <button id="startBtn">Start Screen Share</button>
  <div id="status"></div>

  <script>

    // full disclosure - this code is 100% written by AI
    // I spent months trying to get this working and chatty P did it in 30s

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');

    let pc = null;
    let stream = null;

    function describeCaptureSettings(track) {
      const settings = track && typeof track.getSettings === 'function' ? track.getSettings() : {};
      const width = settings.width ?? 'unknown';
      const height = settings.height ?? 'unknown';
      const frameRate = settings.frameRate ?? 'unknown';
      return `${width}x${height} @ ${frameRate}fps`;
    }

    async function requestDisplayMedia() {
      const constraints = {
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30, max: 30 },
        },
        audio: false,
      };

      if (navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function') {
        return navigator.mediaDevices.getDisplayMedia(constraints);
      }

      if (typeof navigator.getDisplayMedia === 'function') {
        return navigator.getDisplayMedia(constraints);
      }

      const origin = window.location.origin;
      const contextHint = window.isSecureContext
        ? ""
        : ` Screen capture requires HTTPS or localhost. Current origin: ${origin}`;

      throw new Error(`Screen capture API is unavailable in this browser.${contextHint}`);
    }

    async function checkAvailability() {
      try {
        const res = await fetch('/status');
        if (res.ok) {
          const data = await res.json();
          return data.available;
        }
      } catch (err) {
        console.error("Status check failed:", err);
      }
      return false;
    }

    async function stopStream(reason = "stopped") {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if (pc) {
        pc.close();
        pc = null;
      }
      startBtn.disabled = false;
      startBtn.textContent = "Start Screen Share";
      statusDiv.textContent = `🛑 Stream ${reason}`;
      console.log("Stream stopped:", reason);
    }

    startBtn.onclick = async () => {
      const available = await checkAvailability();
      if (!available) {
        alert("Stream is currently busy. Try again later.");
        statusDiv.textContent = "❌ Stream busy";
        return;
      }

      try {
        stream = await requestDisplayMedia();
      } catch (err) {
        console.error("User cancelled or error:", err);
        if (!window.isSecureContext) {
          statusDiv.textContent = "❌ Screen share blocked: open this page via HTTPS or localhost";
        } else {
          statusDiv.textContent = "❌ Unable to start screen share";
        }
        return;
      }

      pc = new RTCPeerConnection();

      // Handle disconnects (server-side closure or failure)
      pc.onconnectionstatechange = () => {
        console.log("Connection state:", pc.connectionState);
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          stopStream("disconnected");
        }
      };

      for (const track of stream.getTracks()) {
        pc.addTrack(track, stream);
      }

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const response = await fetch("/offer", {
        method: "POST",
        body: JSON.stringify(pc.localDescription),
        headers: { "Content-Type": "application/json" },
      });

      if (!response.ok) {
        const message = await response.text();
        alert(message);
        stopStream("rejected");
        return;
      }

      const answer = await response.json();
      await pc.setRemoteDescription(answer);

      startBtn.disabled = true;
      startBtn.textContent = "Streaming...";
      statusDiv.textContent = "✅ Streaming active";

      // Optional: stop if the user manually stops sharing
      stream.getVideoTracks()[0].onended = () => {
        stopStream("ended by user");
      };

      const videoTrack = stream.getVideoTracks()[0];
      const actualCapture = describeCaptureSettings(videoTrack);
      console.log("Capture settings:", actualCapture);
      statusDiv.textContent = `✅ Streaming active (${actualCapture})`;
    };
  </script>
</body>
</html>
