<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebRTC Screen Share</title>
</head>
<body>
  <button id="startBtn">Start Screen Share</button>
  <label for="qualitySelect">Quality:</label>
  <select id="qualitySelect">
    <option value="auto">Auto</option>
    <option value="high">High</option>
    <option value="floor">Low</option>
  </select>
  <div id="status"></div>

  <script>

    const startBtn = document.getElementById("startBtn");
    const qualitySelect = document.getElementById("qualitySelect");
    const statusDiv = document.getElementById("status");

    let pc = null;
    let stream = null;
    let videoSender = null;
    let fpsMonitor = null;
    let connectionTimeoutId = null;

    let isStreaming = false;
    let isStarting = false;
    let isAdaptiveRestartInProgress = false;
    let isLowMotionContent = false;

    let currentFps = "unknown";
    let currentWidth = "unknown";
    let currentHeight = "unknown";

    let captureSettings = { width: 1920, height: 1080, frameRate: 30 };
    let iceServers = [];
    let captureSourceAspectRatio = null;
    let captureSourceWidth = null;
    let captureSourceHeight = null;
    let captureDisplaySurface = null;
    let audioEnabled = true;
    let isAudioActive = false;
    let audioWarning = null;

    // Adaptive policy values are loaded from /capture-settings so server-side
    // configuration remains the single source of truth.
    let adaptivePolicy = {
      lowFpsThreshold: 30,
      lowSampleWindow: 10,
      lowSampleRequired: 10,
      recoveryFpsThreshold: 35,
      recoverySampleWindow: 20,
      recoverySampleRequired: 18,
      downgradeCooldownSeconds: 20,
      upgradeCooldownSeconds: 60,
      minWidth: 1280,
      minHeight: 720,
      maxWidth: 1920,
      maxHeight: 1080,
    };

    // Sender policy values are loaded from /capture-settings so tuning is
    // centralized and Pi behavior remains reproducible.
    let senderPolicy = {
      degradationPreference: "maintain-framerate",
      bitrateMaxBps1080p: 5000000,
      bitrateMinBps1080p: 0,
      bitrateMaxBps720p: 2800000,
      bitrateMinBps720p: 0,
    };

    // We intentionally run only two quality modes in this phase:
    // - high: 1080p target
    // - floor: 720p target
    // This avoids fragile quality ladders while enforcing the no-below-720p rule.
    let currentQualityMode = "high";
    let qualityControlMode = "auto";
    let activeProfile = null;
    let fpsSamples = [];
    let lastQualityChangeAtMs = 0;

    const ICE_GATHER_TIMEOUT_MS = 8000;
    const CONNECTION_TIMEOUT_MS = 10000;
    const LOW_MOTION_FPS_THRESHOLD = 2;
    const LOW_MOTION_BITRATE_BPS_THRESHOLD = 120000;

    function countSdpCandidates(sdp) {
      if (!sdp) {
        return 0;
      }
      return sdp.split("\n").filter((line) => line.startsWith("a=candidate:")).length;
    }

    function clampInt(value, fallback) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) {
        return fallback;
      }
      return Math.round(parsed);
    }

    function roundToEven(value, fallback) {
      const rounded = clampInt(value, fallback);
      if (rounded <= 0) {
        return fallback;
      }
      return rounded % 2 === 0 ? rounded : rounded - 1;
    }

    function getAspectRatioFromSettings(settings) {
      if (!settings) {
        return null;
      }

      const explicitAspectRatio = Number(settings.aspectRatio);
      if (Number.isFinite(explicitAspectRatio) && explicitAspectRatio > 0) {
        return explicitAspectRatio;
      }

      const width = Number(settings.width);
      const height = Number(settings.height);
      if (Number.isFinite(width) && Number.isFinite(height) && width > 0 && height > 0) {
        return width / height;
      }

      return null;
    }

    function resolveAspectMatchedProfile(profile) {
      if (!profile || !Number.isFinite(captureSourceAspectRatio) || captureSourceAspectRatio <= 0) {
        return profile;
      }

      const maxWidth = clampInt(profile.width, captureSettings.width);
      const maxHeight = clampInt(profile.height, captureSettings.height);

      let width = maxWidth;
      let height = roundToEven(width / captureSourceAspectRatio, maxHeight);

      if (height > maxHeight) {
        height = maxHeight;
        width = roundToEven(height * captureSourceAspectRatio, maxWidth);
      }

      return {
        width: Math.max(2, Math.min(maxWidth, width)),
        height: Math.max(2, Math.min(maxHeight, height)),
        frameRate: profile.frameRate,
      };
    }

    function getNormalizedCaptureGeometry(settings) {
      const width = Number(settings && settings.width);
      const height = Number(settings && settings.height);

      let normalizedWidth = Number.isFinite(width) && width > 0
        ? clampInt(width, captureSourceWidth || captureSettings.width)
        : null;
      let normalizedHeight = Number.isFinite(height) && height > 0
        ? clampInt(height, captureSourceHeight || captureSettings.height)
        : null;

      const displaySurface = settings && typeof settings.displaySurface === "string"
        ? settings.displaySurface
        : null;

      // Browsers can report monitor captures a few pixels smaller than the
      // actual display because of encoder alignment or OS capture edges.
      // When the reported size is only slightly smaller than the real screen,
      // snap back to the true screen bounds so quality decisions use the
      // selected display size rather than the encoded crop.
      if (displaySurface === "monitor" && normalizedWidth !== null && normalizedHeight !== null) {
        const screenWidth = window.screen ? clampInt(window.screen.width, normalizedWidth) : null;
        const screenHeight = window.screen ? clampInt(window.screen.height, normalizedHeight) : null;
        if (screenWidth !== null && screenHeight !== null) {
          const widthDelta = Math.abs(screenWidth - normalizedWidth);
          const heightDelta = Math.abs(screenHeight - normalizedHeight);
          if (widthDelta <= 16 && heightDelta <= 16) {
            normalizedWidth = screenWidth;
            normalizedHeight = screenHeight;
          }
        }
      }

      return {
        width: normalizedWidth,
        height: normalizedHeight,
        displaySurface,
      };
    }

    function updateCaptureSourceGeometry(settings, options = {}) {
      let didChange = false;
      const allowDecrease = options.allowDecrease === true;

      const normalized = getNormalizedCaptureGeometry(settings);

      if (normalized.displaySurface !== null && normalized.displaySurface !== captureDisplaySurface) {
        captureDisplaySurface = normalized.displaySurface;
      }

      const nextAspectRatio = getAspectRatioFromSettings(settings);
      if (
        Number.isFinite(nextAspectRatio)
        && nextAspectRatio > 0
        && nextAspectRatio !== captureSourceAspectRatio
        && (captureSourceAspectRatio === null || allowDecrease || nextAspectRatio > captureSourceAspectRatio)
      ) {
        captureSourceAspectRatio = nextAspectRatio;
        didChange = true;
      }

      if (normalized.width !== null) {
        const nextWidth = normalized.width;
        if (
          nextWidth !== captureSourceWidth
          && (captureSourceWidth === null || nextWidth > captureSourceWidth || allowDecrease)
        ) {
          captureSourceWidth = nextWidth;
          didChange = true;
        }
      }
      if (normalized.height !== null) {
        const nextHeight = normalized.height;
        if (
          nextHeight !== captureSourceHeight
          && (captureSourceHeight === null || nextHeight > captureSourceHeight || allowDecrease)
        ) {
          captureSourceHeight = nextHeight;
          didChange = true;
        }
      }

      return didChange;
    }

    function profilesMatch(leftProfile, rightProfile) {
      return !!leftProfile
        && !!rightProfile
        && leftProfile.width === rightProfile.width
        && leftProfile.height === rightProfile.height
        && leftProfile.frameRate === rightProfile.frameRate;
    }

    async function syncProfileToSourceGeometry(reason) {
      if (!isStreaming || isStarting || isAdaptiveRestartInProgress) {
        return;
      }

      const targetProfile = profileForMode(currentQualityMode);
      if (profilesMatch(activeProfile, targetProfile)) {
        return;
      }

      await requestAdaptiveQualitySwitch(targetProfile, currentQualityMode, reason);
    }

    function getHighProfileBase() {
      return {
        width: captureSourceWidth && captureSourceWidth > 0
          ? Math.min(adaptivePolicy.maxWidth, captureSourceWidth)
          : adaptivePolicy.maxWidth,
        height: captureSourceHeight && captureSourceHeight > 0
          ? Math.min(adaptivePolicy.maxHeight, captureSourceHeight)
          : adaptivePolicy.maxHeight,
        frameRate: captureSettings.frameRate,
      };
    }

    function getLowProfileBase() {
      const highProfile = getHighProfileBase();

      if (
        captureSourceWidth && captureSourceHeight
        && (captureSourceWidth < adaptivePolicy.minWidth && captureSourceHeight < adaptivePolicy.minHeight)
      ) {
        return {
          width: Math.max(2, roundToEven(highProfile.width / 2, highProfile.width)),
          height: Math.max(2, roundToEven(highProfile.height / 2, highProfile.height)),
          frameRate: captureSettings.frameRate,
        };
      }

      return {
        width: adaptivePolicy.minWidth,
        height: adaptivePolicy.minHeight,
        frameRate: captureSettings.frameRate,
      };
    }

    function updateStreamingStatus() {
      const audioStatus = isAudioActive ? "audio:on" : "audio:off";
      const warningSuffix = audioWarning ? ` (${audioWarning})` : "";
      statusDiv.textContent = `✅ Streaming active (${currentWidth}x${currentHeight} @ ${currentFps}fps, ${audioStatus})${warningSuffix}`;
    }

    function buildAudioConstraints() {
      if (!audioEnabled) {
        return false;
      }

      // Content playback benefits from preserving source dynamics rather than
      // applying speech-focused processing.
      return {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      };
    }

    function isDisplayMediaConstraintCompatibilityError(err) {
      return err instanceof TypeError
        || (err && typeof err.name === "string" && [
          "OverconstrainedError",
          "NotFoundError",
        ].includes(err.name));
    }

    function getPreferredVideoCodecs() {
      if (typeof RTCRtpSender === "undefined" || typeof RTCRtpSender.getCapabilities !== "function") {
        return [];
      }

      const caps = RTCRtpSender.getCapabilities("video");
      if (!caps || !Array.isArray(caps.codecs)) {
        return [];
      }

      const nonMediaMimes = new Set(["video/rtx", "video/red", "video/ulpfec"]);
      const mediaCodecs = caps.codecs.filter((codec) => !nonMediaMimes.has((codec.mimeType || "").toLowerCase()));
      if (mediaCodecs.length === 0) {
        return [];
      }

      // Keep H264 as last-resort fallback. Auto and manual VP8/VP9 both prefer
      // VPx first to avoid forcing H264 unless negotiation requires it.
      const preferredOrder = ["video/VP9", "video/VP8", "video/H264"];

      const orderedMediaCodecs = [];
      for (const mimeType of preferredOrder) {
        for (const codec of mediaCodecs) {
          if (codec.mimeType === mimeType) {
            orderedMediaCodecs.push(codec);
          }
        }
      }

      // If browser exposes an unexpected video codec type, keep it after known
      // codecs so preference remains explicit but negotiation stays robust.
      for (const codec of mediaCodecs) {
        if (!orderedMediaCodecs.includes(codec)) {
          orderedMediaCodecs.push(codec);
        }
      }

      return orderedMediaCodecs;
    }

    function bitrateBoundsForProfile(profile) {
      const resolvedProfile = resolveAspectMatchedProfile(profile || profileForMode(currentQualityMode));
      const width = clampInt(resolvedProfile && resolvedProfile.width, adaptivePolicy.maxWidth);
      const height = clampInt(resolvedProfile && resolvedProfile.height, adaptivePolicy.maxHeight);
      const pixelCount = width * height;

      if (pixelCount <= adaptivePolicy.minWidth * adaptivePolicy.minHeight) {
        return {
          minBitrate: senderPolicy.bitrateMinBps720p,
          maxBitrate: senderPolicy.bitrateMaxBps720p,
        };
      }

      return {
        minBitrate: senderPolicy.bitrateMinBps1080p,
        maxBitrate: senderPolicy.bitrateMaxBps1080p,
      };
    }

    async function applySenderEncodingPolicy(sender, profile, reason) {
      if (!sender || typeof sender.getParameters !== "function" || typeof sender.setParameters !== "function") {
        return;
      }

      const resolvedProfile = resolveAspectMatchedProfile(profile || profileForMode(currentQualityMode));
      const bitrateBounds = bitrateBoundsForProfile(resolvedProfile);
      const parameters = sender.getParameters();
      parameters.encodings = parameters.encodings && parameters.encodings.length > 0
        ? parameters.encodings
        : [{}];

      const primaryEncoding = parameters.encodings[0];
      primaryEncoding.maxFramerate = resolvedProfile.frameRate;
      primaryEncoding.maxBitrate = bitrateBounds.maxBitrate;
      if (bitrateBounds.minBitrate > 0) {
        primaryEncoding.minBitrate = bitrateBounds.minBitrate;
      } else {
        delete primaryEncoding.minBitrate;
      }

      // Keep a single temporal/spatial layer to avoid extra encoding overhead.
      primaryEncoding.scalabilityMode = "L1T1";
      parameters.degradationPreference = senderPolicy.degradationPreference;

      try {
        await sender.setParameters(parameters);
      } catch (err) {
        // Some engines reject less-common fields (for example minBitrate or
        // degradationPreference). Retry with a compatibility subset so the
        // high-impact maxBitrate/maxFramerate policy still applies.
        console.warn(`Full sender policy rejected (${reason}); retrying compatibility subset.`, err);
        delete primaryEncoding.minBitrate;
        delete primaryEncoding.scalabilityMode;
        delete parameters.degradationPreference;
        try {
          await sender.setParameters(parameters);
        } catch (fallbackErr) {
          console.warn(`Unable to apply sender encoding policy (${reason}):`, fallbackErr);
          return;
        }
      }

      console.log("Applied sender encoding policy", {
        reason,
        profile: resolvedProfile,
        degradationPreference: senderPolicy.degradationPreference,
        minBitrate: bitrateBounds.minBitrate,
        maxBitrate: bitrateBounds.maxBitrate,
      });
    }

    function clearConnectionTimeout() {
      if (connectionTimeoutId !== null) {
        clearTimeout(connectionTimeoutId);
        connectionTimeoutId = null;
      }
    }

    function startConnectionTimeout() {
      clearConnectionTimeout();
      connectionTimeoutId = setTimeout(() => {
        console.warn(`Connection timed out after ${CONNECTION_TIMEOUT_MS / 1000}s without reaching connected state.`);
        stopStream("connection timed out");
      }, CONNECTION_TIMEOUT_MS);
    }

    function maxSampleWindowSize() {
      return Math.max(adaptivePolicy.lowSampleWindow, adaptivePolicy.recoverySampleWindow);
    }

    function pushFpsSample(fpsValue) {
      if (!Number.isFinite(fpsValue)) {
        return;
      }
      fpsSamples.push(Math.round(fpsValue));
      const maxSize = maxSampleWindowSize();
      if (fpsSamples.length > maxSize) {
        fpsSamples = fpsSamples.slice(fpsSamples.length - maxSize);
      }
    }

    function countWindowByPredicate(windowSize, predicate) {
      if (fpsSamples.length < windowSize) {
        return null;
      }
      const recent = fpsSamples.slice(fpsSamples.length - windowSize);
      return recent.filter(predicate).length;
    }

    function profileForMode(mode) {
      if (mode === "floor") {
        return resolveAspectMatchedProfile(getLowProfileBase());
      }

      return resolveAspectMatchedProfile(getHighProfileBase());
    }

    function modeFromProfile(profile) {
      if (!profile) {
        return "high";
      }
      if (profile.width <= adaptivePolicy.minWidth && profile.height <= adaptivePolicy.minHeight) {
        return "floor";
      }
      return "high";
    }

    async function loadCaptureSettings() {
      try {
        const response = await fetch("/capture-settings");
        if (!response.ok) {
          return;
        }

        const settings = await response.json();

        captureSettings = {
          width: clampInt(settings.width, captureSettings.width),
          height: clampInt(settings.height, captureSettings.height),
          frameRate: clampInt(settings.frameRate, captureSettings.frameRate),
        };

        iceServers = Array.isArray(settings.iceServers) ? settings.iceServers : [];

        adaptivePolicy = {
          lowFpsThreshold: clampInt(settings.adaptLowFpsThreshold, adaptivePolicy.lowFpsThreshold),
          lowSampleWindow: clampInt(settings.adaptLowSampleWindow, adaptivePolicy.lowSampleWindow),
          lowSampleRequired: clampInt(settings.adaptLowSampleRequired, adaptivePolicy.lowSampleRequired),
          recoveryFpsThreshold: clampInt(settings.adaptRecoveryFpsThreshold, adaptivePolicy.recoveryFpsThreshold),
          recoverySampleWindow: clampInt(settings.adaptRecoverySampleWindow, adaptivePolicy.recoverySampleWindow),
          recoverySampleRequired: clampInt(settings.adaptRecoverySampleRequired, adaptivePolicy.recoverySampleRequired),
          downgradeCooldownSeconds: clampInt(settings.adaptDowngradeCooldownSeconds, adaptivePolicy.downgradeCooldownSeconds),
          upgradeCooldownSeconds: clampInt(settings.adaptUpgradeCooldownSeconds, adaptivePolicy.upgradeCooldownSeconds),
          minWidth: clampInt(settings.adaptMinWidth, adaptivePolicy.minWidth),
          minHeight: clampInt(settings.adaptMinHeight, adaptivePolicy.minHeight),
          maxWidth: clampInt(settings.adaptMaxWidth, adaptivePolicy.maxWidth),
          maxHeight: clampInt(settings.adaptMaxHeight, adaptivePolicy.maxHeight),
        };

        senderPolicy = {
          degradationPreference: typeof settings.degradationPreference === "string"
            ? settings.degradationPreference
            : senderPolicy.degradationPreference,
          bitrateMaxBps1080p: clampInt(settings.bitrateMaxBps1080p, senderPolicy.bitrateMaxBps1080p),
          bitrateMinBps1080p: clampInt(settings.bitrateMinBps1080p, senderPolicy.bitrateMinBps1080p),
          bitrateMaxBps720p: clampInt(settings.bitrateMaxBps720p, senderPolicy.bitrateMaxBps720p),
          bitrateMinBps720p: clampInt(settings.bitrateMinBps720p, senderPolicy.bitrateMinBps720p),
        };

        audioEnabled = settings.audioEnabled !== false;
      } catch (err) {
        console.error("Failed to load capture settings:", err);
      }
    }

    async function waitForIceGatheringComplete(peerConnection, timeoutMs = ICE_GATHER_TIMEOUT_MS) {
      if (!peerConnection || peerConnection.iceGatheringState === "complete") {
        return;
      }

      await new Promise((resolve) => {
        let settled = false;

        const finish = () => {
          if (settled) {
            return;
          }
          settled = true;
          clearTimeout(timeoutId);
          peerConnection.removeEventListener("icegatheringstatechange", handleStateChange);
          resolve();
        };

        const handleStateChange = () => {
          console.log("ICE gathering state:", peerConnection.iceGatheringState);
          if (peerConnection.iceGatheringState === "complete") {
            finish();
          }
        };

        const timeoutId = setTimeout(() => {
          console.warn(`Timed out waiting ${timeoutMs}ms for ICE gathering; continuing with current offer.`);
          finish();
        }, timeoutMs);

        peerConnection.addEventListener("icegatheringstatechange", handleStateChange);
      });
    }

    function stopFpsMonitor(resetStatus = true) {
      if (fpsMonitor) {
        clearInterval(fpsMonitor);
        fpsMonitor = null;
      }
      if (resetStatus) {
        currentFps = "unknown";
        currentWidth = "unknown";
        currentHeight = "unknown";
      }
      fpsSamples = [];
      isLowMotionContent = false;
      videoSender = null;
    }

    async function evaluateAdaptiveQuality() {
      // Manual mode must disable auto switching so user-selected quality
      // remains pinned until they switch back to Auto.
      if (qualityControlMode !== "auto") {
        return;
      }

      if (!isStreaming || isStarting || isAdaptiveRestartInProgress) {
        return;
      }

      const nowMs = Date.now();

      // Critical invariant: downshift aggressively to protect motion smoothness.
      // We intentionally require a full 10-second low-FPS window so brief dips
      // do not cause unnecessary quality changes.
      if (currentQualityMode === "high") {
        const lowCount = countWindowByPredicate(
          adaptivePolicy.lowSampleWindow,
          (sample) => sample < adaptivePolicy.lowFpsThreshold,
        );

        if (lowCount !== null && lowCount >= adaptivePolicy.lowSampleRequired) {
          const elapsedSinceLastChangeMs = nowMs - lastQualityChangeAtMs;
          const cooldownMs = adaptivePolicy.downgradeCooldownSeconds * 1000;
          if (lastQualityChangeAtMs !== 0 && elapsedSinceLastChangeMs < cooldownMs) {
            return;
          }

          const target = profileForMode("floor");
          await requestAdaptiveQualitySwitch(
            target,
            "floor",
            `fps below ${adaptivePolicy.lowFpsThreshold} for ${adaptivePolicy.lowSampleRequired}/${adaptivePolicy.lowSampleWindow} samples`,
          );
        }

        return;
      }

      // Critical invariant: recovery requires stronger evidence than downgrade.
      // This asymmetric hysteresis prevents quality flapping on marginal links.
      if (currentQualityMode === "floor") {
        const recoveryCount = countWindowByPredicate(
          adaptivePolicy.recoverySampleWindow,
          (sample) => sample >= adaptivePolicy.recoveryFpsThreshold,
        );

        if (recoveryCount !== null && recoveryCount >= adaptivePolicy.recoverySampleRequired) {
          const elapsedSinceLastChangeMs = nowMs - lastQualityChangeAtMs;
          const cooldownMs = adaptivePolicy.upgradeCooldownSeconds * 1000;
          if (lastQualityChangeAtMs !== 0 && elapsedSinceLastChangeMs < cooldownMs) {
            return;
          }

          const target = profileForMode("high");
          await requestAdaptiveQualitySwitch(
            target,
            "high",
            `fps recovered above ${adaptivePolicy.recoveryFpsThreshold} for ${adaptivePolicy.recoverySampleRequired}/${adaptivePolicy.recoverySampleWindow} samples`,
          );
        }
      }
    }

    async function applyQualityControlMode(mode) {
      qualityControlMode = mode;
      qualitySelect.value = mode;

      if (!isStreaming) {
        return;
      }

      if (mode === "auto") {
        fpsSamples = [];
        return;
      }

      const targetMode = mode === "high" ? "high" : "floor";
      if (targetMode === currentQualityMode) {
        return;
      }

      await requestAdaptiveQualitySwitch(profileForMode(targetMode), targetMode, `manual mode ${mode}`);
    }

    function startFpsMonitor(sender) {
      stopFpsMonitor(false);
      if (!sender || typeof sender.getStats !== "function") {
        return;
      }

      let lastTimestamp = null;
      let lastFramesEncoded = null;
      let lastBytesSent = null;
      let lastSenderLogAt = 0;

      fpsMonitor = setInterval(async () => {
        try {
          const stats = await sender.getStats();
          let videoStat = null;
          stats.forEach((report) => {
            if (!videoStat && report.type === "outbound-rtp" && report.kind === "video") {
              videoStat = report;
            }
          });

          if (!videoStat) {
            currentFps = "unknown";
            updateStreamingStatus();
            return;
          }

          const timestamp = videoStat.timestamp;
          const framesEncoded = typeof videoStat.framesEncoded === "number"
            ? videoStat.framesEncoded
            : (typeof videoStat.framesSent === "number" ? videoStat.framesSent : null);
          const bytesSent = typeof videoStat.bytesSent === "number" ? videoStat.bytesSent : null;
          let currentBitrateBps = null;
          let sampledFps = null;

          if (lastTimestamp !== null && lastFramesEncoded !== null && framesEncoded !== null) {
            const elapsedSeconds = (timestamp - lastTimestamp) / 1000;
            if (elapsedSeconds > 0) {
              const fps = (framesEncoded - lastFramesEncoded) / elapsedSeconds;
              if (Number.isFinite(fps)) {
                const rounded = Math.round(fps);
                sampledFps = rounded;
                currentFps = String(rounded);
              } else {
                currentFps = "unknown";
              }

              if (bytesSent !== null && lastBytesSent !== null) {
                const deltaBytes = bytesSent - lastBytesSent;
                currentBitrateBps = Math.max(0, (deltaBytes * 8) / elapsedSeconds);
              }
            }
          }

          if (framesEncoded !== null) {
            lastTimestamp = timestamp;
            lastFramesEncoded = framesEncoded;
          }
          if (bytesSent !== null) {
            lastBytesSent = bytesSent;
          }

          const lowMotionDetected = sampledFps !== null
            && sampledFps <= LOW_MOTION_FPS_THRESHOLD
            && Number.isFinite(currentBitrateBps)
            && currentBitrateBps <= LOW_MOTION_BITRATE_BPS_THRESHOLD;

          if (lowMotionDetected) {
            if (!isLowMotionContent) {
              console.log("Low-motion scene detected; pausing FPS-driven auto-downgrade.", {
                sampledFps,
                currentBitrateBps,
              });
            }
            isLowMotionContent = true;
            fpsSamples = [];
            currentFps = "<idle>";

            if (qualityControlMode === "auto" && currentQualityMode === "floor" && !isAdaptiveRestartInProgress) {
              await requestAdaptiveQualitySwitch(
                profileForMode("high"),
                "high",
                "low-motion scene prioritize detail",
              );
            }
          } else {
            isLowMotionContent = false;
            if (sampledFps !== null) {
              pushFpsSample(sampledFps);
            }
          }

          const videoTrack = stream ? stream.getVideoTracks()[0] : null;
          const trackSettings = videoTrack && typeof videoTrack.getSettings === "function"
            ? videoTrack.getSettings()
            : {};
          const allowSourceDecrease = currentQualityMode === "high"
            && !!activeProfile
            && (
              (Number.isFinite(trackSettings.width) && trackSettings.width < activeProfile.width)
              || (Number.isFinite(trackSettings.height) && trackSettings.height < activeProfile.height)
            );
          const geometryDidChange = updateCaptureSourceGeometry(trackSettings, { allowDecrease: allowSourceDecrease });

          currentWidth = videoStat.frameWidth || trackSettings.width || currentWidth;
          currentHeight = videoStat.frameHeight || trackSettings.height || currentHeight;

          if (geometryDidChange) {
            await syncProfileToSourceGeometry("capture source resized");
          }

          if (timestamp - lastSenderLogAt >= 5000) {
            lastSenderLogAt = timestamp;
            const qualityLimitationReason = videoStat.qualityLimitationReason || "unknown";
            const qualityLimitationDurations = videoStat.qualityLimitationDurations || {};
            const captureFps = typeof videoStat.framesPerSecond === "number"
              ? Math.round(videoStat.framesPerSecond)
              : null;
            const frameWidth = videoStat.frameWidth || currentWidth;
            const frameHeight = videoStat.frameHeight || currentHeight;
            const codec = videoStat.codecId ? stats.get(videoStat.codecId) : null;
            const negotiatedCodec = codec && codec.mimeType ? codec.mimeType : "unknown";
            console.log(
              "Sender stats:",
              {
                fps: currentFps,
                frameWidth,
                frameHeight,
                captureFps,
                sourceWidth: captureSourceWidth,
                sourceHeight: captureSourceHeight,
                displaySurface: captureDisplaySurface,
                qualityLimitationReason,
                qualityLimitationDurations,
                bytesSent,
                currentBitrateBps,
                isLowMotionContent,
                negotiatedCodec,
              },
            );
          }

          updateStreamingStatus();
          if (!isLowMotionContent) {
            await evaluateAdaptiveQuality();
          }
        } catch (err) {
          console.warn("Failed to read outbound video stats:", err);
          currentFps = "unknown";
          updateStreamingStatus();
        }
      }, 1000);
    }

    async function requestDisplayMedia(profile) {
      const baseVideoConstraints = {
        // Window streaming is more reliable for protected playback surfaces
        // in this app, so we intentionally avoid full-monitor capture.
        displaySurface: "window",
        monitorTypeSurfaces: "exclude",
        selfBrowserSurface: "exclude",
        surfaceSwitching: "exclude",
        cursor: "always",
        logicalSurface: true,
        width: { ideal: profile.width },
        height: { ideal: profile.height },
        aspectRatio: { ideal: captureSourceAspectRatio || (profile.width / profile.height) },
        frameRate: { ideal: profile.frameRate, max: profile.frameRate },
      };

      const strictConstraints = {
        video: {
          ...baseVideoConstraints,
        },
        audio: buildAudioConstraints(),
      };

      const fallbackConstraints = {
        video: {
          width: { ideal: profile.width },
          height: { ideal: profile.height },
          aspectRatio: { ideal: captureSourceAspectRatio || (profile.width / profile.height) },
          frameRate: { ideal: profile.frameRate, max: profile.frameRate },
        },
        audio: buildAudioConstraints(),
      };

      const videoOnlyFallbackConstraints = {
        ...fallbackConstraints,
        audio: false,
      };

      const validateSelectedSurface = (selectedStream) => {
        if (!selectedStream) {
          return selectedStream;
        }

        const selectedVideoTrack = selectedStream.getVideoTracks()[0];
        const selectedSettings = selectedVideoTrack && typeof selectedVideoTrack.getSettings === "function"
          ? selectedVideoTrack.getSettings()
          : {};
        const selectedDisplaySurface = selectedSettings && typeof selectedSettings.displaySurface === "string"
          ? selectedSettings.displaySurface
          : null;

        if (selectedDisplaySurface === "monitor") {
          selectedStream.getTracks().forEach((track) => track.stop());
          throw new Error("Please select a window or browser tab to share. Full screen sharing is disabled for this app.");
        }

        return selectedStream;
      };

      if (navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === "function") {
        try {
          const selectedStream = await navigator.mediaDevices.getDisplayMedia(strictConstraints);
          return validateSelectedSurface(selectedStream);
        } catch (err) {
          // Some browsers reject strict, non-standard screen-picker hints.
          // Fall back to standard constraints, then enforce window-only by
          // validating the selected display surface.
          if (isDisplayMediaConstraintCompatibilityError(err)) {
            try {
              const selectedStream = await navigator.mediaDevices.getDisplayMedia(fallbackConstraints);
              return validateSelectedSurface(selectedStream);
            } catch (fallbackErr) {
              if (audioEnabled && isDisplayMediaConstraintCompatibilityError(fallbackErr)) {
                console.warn("Audio capture constraints unsupported; continuing with video-only.", fallbackErr);
                const selectedStream = await navigator.mediaDevices.getDisplayMedia(videoOnlyFallbackConstraints);
                return validateSelectedSurface(selectedStream);
              }
              throw fallbackErr;
            }
          }
          throw err;
        }
      }

      if (typeof navigator.getDisplayMedia === "function") {
        const selectedStream = await navigator.getDisplayMedia(fallbackConstraints);
        return validateSelectedSurface(selectedStream);
      }

      const origin = window.location.origin;
      const contextHint = window.isSecureContext
        ? ""
        : ` Screen capture requires HTTPS or localhost. Current origin: ${origin}`;

      throw new Error(`Screen capture API is unavailable in this browser.${contextHint}`);
    }

    async function checkAvailability() {
      try {
        const res = await fetch("/status");
        if (res.ok) {
          const data = await res.json();
          return data.available;
        }
      } catch (err) {
        console.error("Status check failed:", err);
      }
      return false;
    }

    async function stopStream(reason = "stopped") {
      clearConnectionTimeout();
      isAdaptiveRestartInProgress = false;

      stopFpsMonitor();
      isStreaming = false;
      isStarting = false;
      isAudioActive = false;
      audioWarning = null;
      captureSourceAspectRatio = null;
      captureSourceWidth = null;
      captureSourceHeight = null;
      captureDisplaySurface = null;

      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }

      if (pc) {
        pc.close();
        pc = null;
      }

      startBtn.textContent = "Start Screen Share";
      startBtn.disabled = false;
      statusDiv.textContent = `🛑 Stream ${reason}`;
      console.log("Stream stopped:", reason);
    }

    async function requestAdaptiveQualitySwitch(targetProfile, targetMode, reason) {
      if (!isStreaming || isStarting || isAdaptiveRestartInProgress || !stream) {
        return;
      }

      // Critical invariant: adaptive quality changes must be seamless. We avoid
      // reacquiring display media because that prompts the user and interrupts
      // playback. applyConstraints keeps the existing capture session alive.
      isAdaptiveRestartInProgress = true;
      lastQualityChangeAtMs = Date.now();

      console.warn(`Adaptive quality switch -> ${targetMode}: ${reason}`);

      try {
        const videoTrack = stream.getVideoTracks()[0];
        if (!videoTrack) {
          return;
        }

        const resolvedProfile = resolveAspectMatchedProfile(targetProfile);

        await videoTrack.applyConstraints({
          width: { ideal: resolvedProfile.width },
          height: { ideal: resolvedProfile.height },
          aspectRatio: { ideal: captureSourceAspectRatio },
          frameRate: { ideal: resolvedProfile.frameRate, max: resolvedProfile.frameRate },
        });

        await applySenderEncodingPolicy(videoSender, resolvedProfile, `adaptive switch to ${targetMode}`);

        const settings = typeof videoTrack.getSettings === "function" ? videoTrack.getSettings() : {};
        updateCaptureSourceGeometry(settings, { allowDecrease: false });
        currentWidth = settings.width ?? resolvedProfile.width;
        currentHeight = settings.height ?? resolvedProfile.height;
        if (Number.isFinite(settings.frameRate)) {
          currentFps = String(Math.round(settings.frameRate));
        }

        // Clear stale samples so decisions reflect post-switch behavior.
        fpsSamples = [];
        currentQualityMode = targetMode;
        activeProfile = resolvedProfile;
        updateStreamingStatus();
      } catch (err) {
        console.warn(`Adaptive quality switch failed (${targetMode}):`, err);
      } finally {
        isAdaptiveRestartInProgress = false;
      }
    }

    async function startStreaming(options = {}) {
      let selectedProfile = options.profile || null;
      const isAdaptiveRestart = options.isAdaptiveRestart === true;

      if (isStarting || isStreaming) {
        return;
      }

      isStarting = true;
      startBtn.disabled = true;

      if (!isAdaptiveRestart) {
        await loadCaptureSettings();
        activeProfile = profileForMode("high");
      }

      if (!selectedProfile) {
        selectedProfile = profileForMode(currentQualityMode);
      }

      const profile = selectedProfile || activeProfile || profileForMode("high");
      activeProfile = profile;

      const available = await checkAvailability();
      if (!available) {
        isStarting = false;
        startBtn.disabled = false;
        alert("Stream is currently busy. Try again later.");
        statusDiv.textContent = "❌ Stream busy";
        isAdaptiveRestartInProgress = false;
        return;
      }

      try {
        stream = await requestDisplayMedia(profile);
      } catch (err) {
        isStarting = false;
        startBtn.disabled = false;
        isAdaptiveRestartInProgress = false;
        console.error("User cancelled or error:", err);
        if (!window.isSecureContext) {
          statusDiv.textContent = "❌ Screen share blocked: open this page via HTTPS or localhost";
        } else {
          const reason = err && typeof err.message === "string" && err.message.trim().length > 0
            ? err.message.trim()
            : "Unable to start screen share";
          statusDiv.textContent = `❌ ${reason}`;
        }
        return;
      }

      const audioTracks = stream.getAudioTracks();
      isAudioActive = audioTracks.length > 0;
      if (audioEnabled && !isAudioActive) {
        audioWarning = "audio unavailable; streaming video only";
      } else {
        audioWarning = null;
      }

      const videoTrack = stream.getVideoTracks()[0];
      const initialSettings = videoTrack && typeof videoTrack.getSettings === "function" ? videoTrack.getSettings() : {};
      updateCaptureSourceGeometry(initialSettings, { allowDecrease: true });
      const resolvedProfile = profileForMode(currentQualityMode);
      try {
        await videoTrack.applyConstraints({
          width: { ideal: resolvedProfile.width },
          height: { ideal: resolvedProfile.height },
          aspectRatio: { ideal: captureSourceAspectRatio },
          frameRate: { ideal: resolvedProfile.frameRate, max: resolvedProfile.frameRate },
        });
      } catch (err) {
        console.warn("Unable to tighten video track constraints:", err);
      }

      pc = new RTCPeerConnection({
        iceServers,
        iceCandidatePoolSize: 4,
      });
      const currentPc = pc;

      currentPc.onconnectionstatechange = () => {
        console.log("Connection state:", currentPc.connectionState);
        if (currentPc.connectionState === "connected") {
          clearConnectionTimeout();
        }
        if (["disconnected", "failed", "closed"].includes(currentPc.connectionState)) {
          stopStream("disconnected");
        }
      };

      currentPc.oniceconnectionstatechange = () => {
        console.log("ICE connection state:", currentPc.iceConnectionState);
      };

      currentPc.onicecandidate = (event) => {
        if (event.candidate) {
          console.log("ICE candidate gathered:", event.candidate.candidate);
        } else {
          console.log("ICE candidate gathering complete (null candidate event).");
        }
      };

      for (const track of stream.getTracks()) {
        const sender = currentPc.addTrack(track, stream);
        if (track.kind === "video") {
          videoSender = sender;

          // Codec preference is applied before offer creation. This is the
          // least invasive way to test decoder load on Raspberry Pi without
          // introducing receiver-side complexity.
          const videoTransceiver = currentPc.getTransceivers().find((transceiver) => transceiver.sender === sender);
          const preferredCodecs = getPreferredVideoCodecs();
          if (videoTransceiver && preferredCodecs.length > 0 && typeof videoTransceiver.setCodecPreferences === "function") {
            videoTransceiver.setCodecPreferences(preferredCodecs);
          }
        }
        if (track.kind === "video") {
          await applySenderEncodingPolicy(sender, resolvedProfile, "initial stream start");
        }
      }

      const offer = await currentPc.createOffer();
      await currentPc.setLocalDescription(offer);
      await waitForIceGatheringComplete(currentPc);

      console.log("Offer candidate count:", countSdpCandidates(currentPc.localDescription && currentPc.localDescription.sdp));
      startConnectionTimeout();

      try {
        const response = await fetch("/offer", {
          method: "POST",
          body: JSON.stringify(currentPc.localDescription),
          headers: { "Content-Type": "application/json" },
        });

        if (!response.ok) {
          const message = await response.text();
          alert(message);
          await stopStream("rejected");
          isAdaptiveRestartInProgress = false;
          return;
        }

        const answer = await response.json();
        await currentPc.setRemoteDescription(answer);
        console.log("Answer candidate count:", countSdpCandidates(answer.sdp));
      } catch (err) {
        console.error("Offer/answer exchange failed:", err);
        await stopStream("connection failed");
        isAdaptiveRestartInProgress = false;
        return;
      }

      isStreaming = true;
      isStarting = false;
      isAdaptiveRestartInProgress = false;
      startBtn.disabled = false;
      startBtn.textContent = "Stop Screen Share";
      currentFps = "starting";

      videoTrack.onended = () => {
        stopStream("ended by user");
      };

      const settings = videoTrack && typeof videoTrack.getSettings === "function" ? videoTrack.getSettings() : {};
      updateCaptureSourceGeometry(settings, { allowDecrease: false });
      currentWidth = settings.width ?? resolvedProfile.width ?? "unknown";
      currentHeight = settings.height ?? resolvedProfile.height ?? "unknown";
      currentFps = Number.isFinite(settings.frameRate) ? String(Math.round(settings.frameRate)) : currentFps;

      currentQualityMode = modeFromProfile(resolvedProfile);
      activeProfile = resolvedProfile;
      console.log(`Capture settings: ${currentWidth}x${currentHeight} @ ${currentFps}fps`);
      updateStreamingStatus();

      startFpsMonitor(videoSender);
    }

    startBtn.onclick = async () => {
      if (isStreaming) {
        // Critical invariant: manual stop must always override adaptive logic.
        // We explicitly cancel pending adaptive restarts here.
        await stopStream("stopped by user");
        return;
      }

      if (isStarting) {
        return;
      }

      isAdaptiveRestartInProgress = false;
      qualityControlMode = qualitySelect.value;
      currentQualityMode = qualityControlMode === "floor" ? "floor" : "high";
      activeProfile = null;
      await startStreaming({ isAdaptiveRestart: false });
    };

    qualitySelect.onchange = async () => {
      const selectedMode = qualitySelect.value;
      if (!["auto", "high", "floor"].includes(selectedMode)) {
        qualitySelect.value = qualityControlMode;
        return;
      }

      if (!isStreaming) {
        qualityControlMode = selectedMode;
        return;
      }

      if (isStarting || isAdaptiveRestartInProgress) {
        qualitySelect.value = qualityControlMode;
        return;
      }

      await applyQualityControlMode(selectedMode);
    };

    qualitySelect.value = qualityControlMode;
  </script>
</body>
</html>
