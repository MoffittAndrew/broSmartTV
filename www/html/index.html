<!DOCTYPE html>
<html lang="en">
    <head>
        <title>screen share</title>
        <style>
            video {
                width: 70%;
                border-radius: 5px;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <section class="hide-after-join">
            <button id="share-screen" disabled>Share Your Screen</button>
            <button id="stop-share-screen" hidden>Stop Sharing</button>
        </section>
        <video autoplay playsinline hidden></video>

        <script src="getScreenId.js"> </script>
        <script src="adapter.js"></script>
        <script src="IceServersHandler.js"></script>
        <script src="CodecsHandler.js"></script>
        <script src="BandwidthHandler.js"></script>
        <script src="screen.js"></script>
        <script>
            if(!navigator.getDisplayMedia && !navigator.mediaDevices.getDisplayMedia) {
                document.getElementById('share-screen').disabled = true;
                alert('Your browser does not support the getDisplayMedia API, cannot share screen :(');
            } else {
                var screen = new Screen(); // argument is optional

                // on getting local or remote streams
                screen.onaddstream = function(e) {
                    document.body.appendChild(e.video);
                };

                // check pre-shared screens
                // it is useful to auto-view
                // or search pre-shared screens
                screen.check();

                document.getElementById('share-screen').onclick = function() {
                    screen.share();
                };

                document.getElementById('stop-share-screen').onclick = function() {
                    this.hidden = true;
                    document.getElementById('share-screen').hidden = false;
                    screen.stop();
                };
            };
        </script>
    </body>
</html>
