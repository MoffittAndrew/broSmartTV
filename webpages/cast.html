<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>bro is literally screen casting</title>
</head>
<body data-page="cast">
  <div data-site-nav></div>

  <main>
    <button id="startBtn">start screen share</button>
    <label for="qualitySelect">quality:</label>
    <select id="qualitySelect">
      <option value="auto">auto (recommended)</option>
      <option value="high">high (like 1080p or smthn like that)</option>
      <option value="floor">low (bad)</option>
    </select>
    <div id="status"></div>
    <section aria-labelledby="syncTestHeading">
      <h2 id="syncTestHeading">24fps sync test</h2>
      <p>Use this looped clip to stabilize framerate (~24fps) before streaming actual content.</p>
      <video id="syncTestVideo" width="480" height="270" controls loop muted playsinline preload="none">
        <source src="/test_clip.mp4" type="video/mp4">
        Your browser does not support the sync test video.
      </video>
    </section>
  </main>

  <script src="./site-nav.js"></script>
  <script type="module" src="./screen-share.js"></script>
</body>
</html>
