<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>bro is literally screen casting</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    #status {
      order: 2;
    }

    #syncTest {
      order: 3;
      width: 100%;
      margin-top: auto;
      text-align: center;
    }

    #syncTest p {
      margin: 0.25rem auto 0.5rem;
    }

    #syncTestVideo {
      display: block;
      width: 25%;
      max-width: 480px;
      height: auto;
      margin: 0 auto;
    }
  </style>
</head>
<body data-page="cast">
  <div data-site-nav></div>

  <main>
    <button id="startBtn">start screen share</button>
    <label for="qualitySelect">quality:</label>
    <select id="qualitySelect">
      <option value="auto">auto (recommended)</option>
      <option value="high">high (like 1080p or smthn like that)</option>
      <option value="floor">low (bad)</option>
    </select>
    <section id="syncTest" aria-labelledby="syncTestHeading">
      <h2 id="syncTestHeading">24fps sync test</h2>
      <p>Use this looped clip to compare audio and video timing while screen sharing. It starts muted; use the player controls to unmute or pause it.</p>
      <video id="syncTestVideo" controls loop muted playsinline preload="none">
        <source src="/test_clip.mp4" type="video/mp4">
        Your browser does not support the sync test video.
      </video>
    </section>
    <div id="status"></div>
  </main>

  <script src="./site-nav.js"></script>
  <script type="module" src="./screen-share.js"></script>
</body>
</html>
